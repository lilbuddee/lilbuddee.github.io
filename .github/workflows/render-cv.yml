name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "_data/cv.raw.yml"
      - "_data/cv_publications.yml"
      - "_data/cv_no_articles.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          cv_file=$(find _data  -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          if [ -z "$cv_file" ]; then
            echo "No cv.yml file found!"
            exit 1
          fi
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          rendercv render $cv_file --settings $settings

          # cv_publications.yml / cv_no_articles.yml carry their own
          # settings.render_command block (distinct output paths per
          # variant), so render them without --settings - passing it would
          # replace their embedded settings wholesale and redirect all three
          # variants to the same output files.
          for variant in _data/cv_publications.yml _data/cv_no_articles.yml; do
            if [ -f "$variant" ]; then
              rendercv render "$variant"
            fi
          done

          rm -f assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: |
            assets/rendercv/rendercv_output
            assets/deepak_sathyan_cv.pdf
            assets/deepak_sathyan_publications.pdf
            assets/deepak_sathyan_cv_no_articles.pdf
      - name: Commit and push rendered CV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: render the latest CV" || exit 0
          git pull --rebase origin main
          git push origin main
