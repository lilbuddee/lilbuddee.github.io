name: Fetch New Papers

on:
  schedule:
    - cron: "0 10 * * 1" # every Monday at 10am UTC
    - cron: "0 10 * * 4" # every Thursday at 10am UTC
  workflow_dispatch: # also allows manual trigger

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install bibtexparser requests

      - name: Fetch new papers from InspireHEP
        run: python "scripts/import requests.py"

      - name: Commit if papers.raw.bib changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.raw.bib
          git diff --cached --quiet || git commit -m "chore: add new papers from InspireHEP"
          git push
