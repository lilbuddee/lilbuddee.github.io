name: Fetch New Papers

on:
  schedule:
    # - cron: "0 10 * * 1" # every Monday at 10am UTC
    # - cron: "0 10 * * 4" # every Thursday at 10am UTC
    - cron: "0 10 * * *" # every day at 10am UTC
  workflow_dispatch: # also allows manual trigger

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install bibtexparser pyyaml requests

      - name: Fetch new papers from InspireHEP
        run: python "scripts/import requests.py"

      - name: Refresh InspireHEP citation counts
        # Runs every time (not just when a new paper was found) so citation
        # counts for existing papers also stay fresh - and, more to the
        # point, so a paper added moments ago by the previous step already
        # has a citations.yml entry (and therefore a citation badge on the
        # site) instead of waiting for update-citations.yml's separate
        # Mon/Wed/Fri schedule to catch up to it.
        run: python scripts/fetch_inspire_citations.py

      - name: Commit if papers.raw.bib or citations.yml changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.raw.bib _data/citations.yml
          git diff --cached --quiet || git commit -m "chore: add new papers from InspireHEP"
          git push
