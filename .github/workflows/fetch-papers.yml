name: Fetch New Papers

on:
  schedule:
    # - cron: "0 10 * * 1" # every Monday at 10am UTC
    # - cron: "0 10 * * 4" # every Thursday at 10am UTC
    - cron: "0 10 * * *" # every day at 10am UTC
  workflow_dispatch: # also allows manual trigger

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # RenderCV needs 3.12+

      - run: pip install bibtexparser pyyaml requests

      - name: Sync papers from InspireHEP
        # Adds papers not in papers.raw.bib yet, and fills in journal/volume/
        # pages/doi for preprints that are now published - per InspireHEP, or
        # per Crossref when InspireHEP hasn't caught up yet.
        id: papers
        run: |
          python "scripts/import requests.py"
          if git diff --quiet -- _bibliography/papers.raw.bib; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh InspireHEP citation counts
        # Runs every time (not just when a new paper was found) so citation
        # counts for existing papers also stay fresh - and, more to the
        # point, so a paper added moments ago by the previous step already
        # has a citations.yml entry (and therefore a citation badge on the
        # site) instead of waiting for update-citations.yml's separate
        # Mon/Wed/Fri schedule to catch up to it.
        run: python scripts/fetch_inspire_citations.py

      - name: Regenerate publication lists and CVs
        # A push made with the default GITHUB_TOKEN never triggers other
        # workflows, so update-publications.yml and render-cv.yml would not
        # run after this job's commit. Without this step a new or newly
        # published paper would sit in papers.raw.bib without ever reaching
        # the website's publications page or the PDFs.
        if: steps.papers.outputs.changed == 'true'
        run: |
          pip install "rendercv[full]"
          python _data/make_publications.py
          bash scripts/render_cvs.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography _data assets
          git diff --cached --quiet || git commit -m "chore: sync papers and citations from InspireHEP"
          git pull --rebase origin main
          git push
